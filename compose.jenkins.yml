name: aceest-assignment

services:
  jenkins:
    build:
      context: ./jenkins
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - jenkins_admin_password
    restart: unless-stopped

volumes:
  jenkins_home:

secrets:
  jenkins_admin_password:
    file: ./.jenkins-secrets/admin-password
